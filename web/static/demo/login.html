<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>wechat-claw 管理后台 · 登录</title>
<link rel="stylesheet" href="theme.css">
</head>
<body>

<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
      </svg>
      wechat-claw
    </div>
    <div class="login-title">管理后台</div>
    <div class="login-sub">输入管理密码进入</div>

    <input type="password" class="login-input" id="pwdInput" placeholder="管理密码" autofocus>
    <button class="btn btn-primary login-btn" id="loginBtn">登 录</button>

    <div class="login-hint">忘记密码？删除 <code>.config/admin.password</code><br>后重新运行初始化向导即可重设</div>
  </div>
</div>

<script src="theme.js"></script>
<script>
(function () {
  var btn = document.getElementById("loginBtn");
  var input = document.getElementById("pwdInput");
  function doLogin() {
    var orig = btn.innerHTML;
    btn.innerHTML = "登录中…";
    btn.disabled = true;
    setTimeout(function () {
      window.location.href = "admin.html";
    }, 700);
  }
  btn.addEventListener("click", doLogin);
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter") doLogin();
  });
})();
</script>
</body>
</html>

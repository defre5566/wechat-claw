name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            suffix: linux-x64
          - os: macos-latest
            suffix: macos-arm64
          - os: windows-latest
            suffix: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Setup venv
        run: python -m venv .venv
      - name: Install deps
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then PY=.venv/Scripts/python.exe; else PY=.venv/bin/python; fi
          "$PY" -m pip install -r requirements.txt
          "$PY" -m pip install -e ./vendor/wechat_agent_sdk
      - name: Tests
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then PY=.venv/Scripts/python.exe; else PY=.venv/bin/python; fi
          "$PY" -m pytest tests/ -q --collect-only | tail -1
          "$PY" - "$PY" <<'PYEOF'
          import subprocess, sys
          py = sys.argv[1]
          try:
              r = subprocess.run([py, "-m", "pytest", "tests/", "-v"], timeout=600)
          except subprocess.TimeoutExpired:
              sys.exit("PYTEST TIMEOUT 600s")
          sys.exit(r.returncode)
          PYEOF
      - name: Build
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then PY=.venv/Scripts/python.exe; else PY=.venv/bin/python; fi
          "$PY" scripts/build.py
      - name: Smoke test (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        env:
          WEB_SELFTEST: "1"
        run: |
          dist/wechat-claw &
          PID=$!
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8650/api/state && break
            sleep 1
          done
          kill $PID || true
      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WEB_SELFTEST: "1"
        run: |
          $p = Start-Process -FilePath "dist\wechat-claw.exe" -PassThru
          for ($i = 0; $i -lt 20; $i++) {
            Start-Sleep -Seconds 1
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:8650/api/state" -UseBasicParsing -TimeoutSec 3
              if ($r.StatusCode -eq 200) { break }
            } catch {}
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
      - name: Build deb package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          mkdir -p debpkg/usr/bin debpkg/DEBIAN
          cp dist/wechat-claw debpkg/usr/bin/wechat-claw
          chmod +x debpkg/usr/bin/wechat-claw
          cat > debpkg/DEBIAN/control <<EOF
          Package: wechat-claw
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: wechat-claw <dev@wechat-claw.local>
          Description: WeChat personal assistant bridge (single-file build)
          EOF
          dpkg-deb --build debpkg dist/wechat-claw-${VERSION}-linux-x64.deb
      - name: Rename artifact
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          if [ "${{ runner.os }}" = "Windows" ]; then
            mv dist/wechat-claw.exe dist/wechat-claw-${VERSION}-windows-x64.exe
          else
            mv dist/wechat-claw dist/wechat-claw-${VERSION}-${{ matrix.suffix }}
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: wechat-claw-${{ matrix.suffix }}
          path: dist/wechat-claw-*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Extract release notes from CHANGELOG
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          python - "$VERSION" <<'EOF'
          import re, sys
          version = sys.argv[1]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(rf"^## \[{re.escape(version)}\]\s+-\s+.*$.*?(?=^## \[|\Z)", text, re.S | re.M)
          if not m:
              raise SystemExit(f"CHANGELOG 未找到 [{version}] 节，发布中止")
          open(".release-notes.md", "w", encoding="utf-8").write(m.group(0).strip() + "\n")
          EOF
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          gh release create "$GITHUB_REF_NAME" assets/* \
            --title "wechat-claw ${VERSION}" \
            --notes-file .release-notes.md \
            --repo "$GITHUB_REPOSITORY"
